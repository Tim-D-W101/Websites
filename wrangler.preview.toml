# Preview-only worker on workers.dev. NOT the production frontdoorsites worker.
# Deploy with: node build.js --preview && npx wrangler deploy -c wrangler.preview.toml
# Never run `wrangler deploy` with wrangler.toml from this folder.
name = "fds-blog-01-preview"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
